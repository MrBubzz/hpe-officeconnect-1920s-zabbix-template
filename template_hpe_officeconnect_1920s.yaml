            - value: '24'
              newvalue: softwareLoopback
            - value: '53'
              newvalue: propVirtual
            - value: '117'
              newvalue: gigabitEthernet
            - value: '135'
              newvalue: l2vlan
            - value: '136'
              newvalue: l3ipvlan
            - value: '161'
              newvalue: ieee8023adLag
        - uuid: 54ea310256ff45868707a2e04bcb24db
          name: 'Service state'
          mappings:
